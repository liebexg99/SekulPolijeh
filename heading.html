<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading</title>
</head>
<body>
    <h1>First Heading</h1>
    <p>This is a sample paragraph.
        <br>Heading tags can help to make your pages more accessible and usable.
        It is good coding practice to use heading tags to outline the structure of your web page content.</p>
        <hr>
    <h2>Second Heading</h2>
    <h3>Third Heading</h3>
    <h4>Fourth Heading</h4>
    <h5>Fifth Heading</h5>
    <h6>Sixth Heading</h6>
</body>
</html>
